# Deliberately narrow: this repo is five independent workspaces, not a package,
# and several files are pinned artifacts (the cycle-100-v*.py snapshots each
# reproduce one released dataset revision byte-for-byte and must not be
# reformatted). So the gate selects only rules that catch *bugs*, not style:
#
#   E9   syntax errors that stop a file parsing at all
#   F821 undefined name  -> NameError at runtime
#   F811 redefinition of an unused name -> a merge that silently dropped code
#
# Every one of those has already bitten this repo: an unterminated docstring in
# push-all-to-hub.py (E9), 13 duplicated methods from a bad merge in
# a2a_agent/agent_executor.py (F811), and two NameErrors in eval scripts that
# only fire partway through a paid GPU job (F821).
#
# The cosmetic rules (F401 unused-import, F541 f-string-without-placeholders,
# F841 unused-variable) are intentionally NOT selected: ~115 pre-existing hits,
# mostly in the immutable snapshots. Adopting them means a dedicated cleanup
# pass on the files that are safe to touch, not a flag flip here.
target-version = "py310"

[lint]
select = ["E9", "F821", "F811"]

[lint.per-file-ignores]
# Notebook cells re-import so each cell runs standalone — that is the point.
"*.ipynb" = ["F811"]
# Scaffolder reference snippets are deliberately partial; they are templates
# the skill emits, not runnable modules.
".claude/skills/**" = ["F821"]
