# One-shot branch deletion, run by hand.
#
# `git push --delete` is blocked at 403 by organisation policy on the agent
# egress proxy (see docs/branch-cleanup-2026-08-22.md), so deleting a ref means
# going through the API. This is the same mechanism that cleared the 22 orphan
# refs on 2026-08-22.
#
# **Delete this file once the refs are gone.** That is what happened last time
# and it is deliberate: a permanently available "delete any branch" button, on
# a `workflow_dispatch` anyone with write access can fire, is not something to
# leave lying around for the sake of one stale ref a year.
#
# Three guards, because deleting a ref is not always the harmless cleanup it
# looks like:
#   1. never the default branch, and never a protected one;
#   2. never a branch with an OPEN pull request — GitHub closes the PR when its
#      head ref disappears, so "tidying branches" can silently discard someone's
#      unmerged work. This bit us on 2026-09-16: five Dependabot PRs were alive
#      only because their branches were;
#   3. never a branch holding commits that are not already in the default
#      branch — if it is not an ancestor, deleting it destroys those commits.
#
# `dry_run` defaults to true. Fire it once to read the report, then again with
# dry_run unchecked.
name: Cleanup Stale Branches

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Branch name(s) to delete, separated by spaces or commas"
        required: true
        type: string
        default: "fix/codeql-version-sync"
      dry_run:
        description: "Report what would be deleted without deleting it"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup-stale-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Deleting a ref is a write against the repository's git data. Job-scoped
      # so the grant ends with this job rather than covering the whole file.
      contents: write
      # Read-only: used to check whether a branch still has an open PR.
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      # Full history: the "already merged" guard needs real ancestry, and a
      # shallow clone would make every branch look unmerged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Delete branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCHES: ${{ inputs.branches }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          git fetch origin "$DEFAULT_BRANCH" --quiet
          failed=0
          deleted=0
          skipped=0

          {
            echo "## Branch cleanup"
            echo ""
            echo "Default branch: \`$DEFAULT_BRANCH\` · dry run: \`$DRY_RUN\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Accept both separators without relying on word-splitting surprises.
          for branch in $(echo "$BRANCHES" | tr ',' ' '); do
            [ -n "$branch" ] || continue
            echo "::group::$branch"

            reason=""

            if [ "$branch" = "$DEFAULT_BRANCH" ]; then
              reason="refusing to delete the default branch"
            elif ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              reason="no such branch on origin (already deleted?)"
            elif [ "$(gh api "repos/$REPO/branches/$branch" --jq '.protected')" = "true" ]; then
              reason="branch is protected"
            else
              open_prs="$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$branch" --jq 'length')"
              if [ "$open_prs" != "0" ]; then
                reason="has $open_prs open pull request(s) — deleting the ref would close them"
              elif ! git merge-base --is-ancestor \
                     "refs/remotes/origin/$branch" "refs/remotes/origin/$DEFAULT_BRANCH"; then
                ahead="$(git rev-list --count "refs/remotes/origin/$DEFAULT_BRANCH..refs/remotes/origin/$branch")"
                reason="holds $ahead commit(s) not in $DEFAULT_BRANCH — deleting would lose them"
              fi
            fi

            if [ -n "$reason" ]; then
              echo "SKIP $branch: $reason"
              echo "- ⏭️ \`$branch\` — skipped: $reason" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              echo "::endgroup::"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN $branch: would delete (all guards passed)"
              echo "- 🔎 \`$branch\` — would be deleted (all guards passed)" >> "$GITHUB_STEP_SUMMARY"
            elif gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" --silent; then
              echo "DELETED $branch"
              echo "- ✅ \`$branch\` — deleted" >> "$GITHUB_STEP_SUMMARY"
              deleted=$((deleted + 1))
            else
              echo "::error::failed to delete $branch"
              echo "- ❌ \`$branch\` — API delete failed" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          {
            echo ""
            echo "deleted: $deleted · skipped: $skipped · failed: $failed"
          } >> "$GITHUB_STEP_SUMMARY"

          # A skip is a deliberate refusal, not an error. A failed API call is.
          [ "$failed" -eq 0 ]
